site_name: An EMG Based Human Device Interface System
theme:
  name: material
  font:
    text: Inter
    code: Jetbrains Mono
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.tasklist

extra_css:
  - stylesheets/extra.css
