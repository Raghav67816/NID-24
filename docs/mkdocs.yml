site_name: An EMG Based Human Device Interface System

nav:
  - Home: index.md
  - Analysis Software:
    - Introduction: Analysis Software/Introduction.md
    - RFComm Process: Analysis Software/RFCommProcess.md
    - Data Reader: Analysis Software/DataReader.md

  - Hardware:
    - EasyEMG Board: Hardware/EasyEMG Board.md
    - Controller Board: Hardware/Controller Board.md

theme:
  name: material
  font:
    text: Inter
    code: Jetbrains Mono
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.tasklist
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
